defaults:
  - paper_franka_l0
  - _self_

output_model_name: paper_franka_smwm_seed3072
subdir: paper_new_tasks_v2/franka/smwm_seed3072

model:
  _target_: slewm.baselines.inverse.ExternalInverseJEPA
  inverse_action_dim: 1  # replaced from the aligned dataset contract
  inverse_latent_dim: ${embed_dim}
  inverse_hidden_dim: 256
  inverse_depth: 2
  inverse_layer_norm: false
  inverse_activation: relu

loss:
  sigreg:
    weight: 0.0
  external_inverse:
    enabled: true
    method: smwm
    inverse_weight: 1.0

trainer:
  min_epochs: 20
  max_epochs: 20

early_stopping:
  enabled: true
  min_epochs: 20
  max_epochs: 20
