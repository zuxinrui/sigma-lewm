# Gear episodes that truly reach the strict persistent insertion criterion and
# have an exact 25-raw-step prefix before the first strict-success goal.
split_mode: external_episode_disjoint

dataset_factory:
  _target_: trim.data.aligned_hdf5.AlignedControlHDF5Dataset
  _partial_: true

dataset:
  name: gear_01036_effective4_strict_h5_train_v3.h5
  transitions: 5
  frameskip: 5
  clip_stride: 1
  # The exact goal−25 window is the formal H5 control phase. Each of the 422
  # train episodes contributes it 20 times in total, while ordinary dynamics
  # windows remain present.
  goal_window_repeat: 20
  keys_to_load:
    - pixels
    - action
  required_action_alignment: "obs[t]=s_t, action[t]=a_t"

validation_dataset:
  name: gear_01036_effective4_strict_h5_validation_v3.h5
  transitions: 5
  frameskip: 5
  clip_stride: 1
  keys_to_load:
    - pixels
    - action
  required_action_alignment: "obs[t]=s_t, action[t]=a_t"
