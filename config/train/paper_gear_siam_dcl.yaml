# Copied from le-wm (19e4f60); only the model class path changed (slewm.models.siam.SiamJEPA).
# siam-jepa on Gear (2026-09-25): SimSiam forward + backward (1 - cos to a stop-gradient target,
# symmetrised over time), LeWM architecture, SIGReg off, sphere-constrained states,
# inverse term: dcl_idm. See siam_jepa_model.py / siam_jepa_losses.py.
defaults:
  - paper_gear_l0
  - _self_

output_model_name: paper_gear_siam_dcl_seed3072
subdir: paper_new_tasks_v3/gear/siam_dcl_seed3072

model:
  _target_: slewm.models.siam.SiamJEPA
  siam_embed_dim: ${embed_dim}
  # Replaced from the dataset contract before model construction.
  siam_action_input_dim: 1
  siam_sphere: true
  siam_backward_bottleneck: 0.25
  siam_inverse: dcl_idm
  siam_projection_dim: 64

loss:
  sigreg:
    weight: 0.0
  siam:
    enabled: true
    random_horizon: true
    context_drop_probability: 0.1
    diffusion_sigma_max: 0.3
    teacher_weight: 1.0
    autoregressive_weight: 1.0
    autoregressive_warmup_epochs: 2
    forward_weight: 0.5
    backward_weight: 0.5
    inverse_weight: 1.0
    dcl_idm_temperature: 0.1
    dcl_idm_duplicate_cosine: 0.98
    dcl_idm_symmetric: false
