defaults:
  - paper_gear_l0
  - _self_

output_model_name: paper_gear_smwm_seed3072
subdir: paper_new_tasks_v2/gear/smwm_seed3072

model:
  _target_: trim.baselines.inverse.ExternalInverseJEPA
  inverse_action_dim: 1  # replaced from the aligned dataset contract
  inverse_latent_dim: ${embed_dim}
  inverse_hidden_dim: 256
  inverse_depth: 2
  inverse_layer_norm: false
  inverse_activation: relu

loss:
  sigreg:
    weight: 0.0
  external_inverse:
    enabled: true
    method: smwm
    # Gear/Franka are manipulation tasks closest to SMWM's OGBench-Cube arm,
    # whose published inverse coefficient is 1.0.
    inverse_weight: 1.0

trainer:
  min_epochs: 30
  max_epochs: 30

early_stopping:
  enabled: true
  min_epochs: 30
  max_epochs: 30
