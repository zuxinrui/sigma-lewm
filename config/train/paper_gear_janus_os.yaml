# Janus-JEPA, one-step (Janus-OS), 2026-09-26: the Janus-MS architecture with the LeWM-style one-step
# objective on both directions: teacher forcing over real windows only (no rollout, no noise, no
# context drop). Everything else as Janus-MS.
defaults:
  - paper_gear_janus_ms
  - _self_
output_model_name: paper_gear_janus_os_seed3072
subdir: paper_new_tasks_v3/gear/janus_os_seed3072
loss:
  siam:
    backward_recipe: one_step
    autoregressive_weight: 0.0
    context_drop_probability: 0.0
    diffusion_sigma_max: 0.0
    random_horizon: false
