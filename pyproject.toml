[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slewm"
version = "0.1.0"
description = "Sigma-LeWM: latent world models trained with forward, backward and inverse objectives"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.scripts]
slewm = "slewm.cli:main"

[tool.setuptools.packages.find]
include = ["slewm*"]

[tool.setuptools.package-data]
"slewm.registry" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
